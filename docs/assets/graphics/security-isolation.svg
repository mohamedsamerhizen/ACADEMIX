<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Authority follows the institution and the resource</title><desc id="desc">Roles establish the broad boundary; services validate current access to each protected operation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F8C"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="1198" height="798" rx="16" fill="#F4F8FB" stroke="#CBD9E4"/><text x="44" y="48" font-size="18" fill="#087F8C" font-weight="700">ACADEMIX / ENGINEERING ATLAS</text><text x="44" y="100" font-size="38" fill="#102A43" font-weight="700">Authority follows the institution and the resource</text><text x="44" y="139" font-size="23" fill="#526C80" font-weight="400">Roles establish the broad boundary; services validate current access to each protected operation.</text><rect x="44" y="185" width="330" height="165" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="223" font-size="20" fill="#087F8C" font-weight="700">01 / IDENTITY</text><text x="68" y="263" font-size="26" fill="#183B56" font-weight="700">JWT + refresh sessions</text><text x="68" y="301" font-size="22" fill="#526C80" font-weight="400">Identity accounts and roles</text><text x="68" y="332" font-size="22" fill="#526C80" font-weight="400">Rotation / revocation controls</text><rect x="435" y="185" width="330" height="165" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="459" y="223" font-size="20" fill="#087F8C" font-weight="700">02 / OPERATION</text><text x="459" y="263" font-size="26" fill="#183B56" font-weight="700">Institution-aware policies</text><text x="459" y="301" font-size="22" fill="#526C80" font-weight="400">Active user and memberships</text><text x="459" y="332" font-size="22" fill="#526C80" font-weight="400">Assignment / object ownership</text><rect x="826" y="185" width="330" height="165" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="850" y="223" font-size="20" fill="#087F8C" font-weight="700">03 / RESOURCE</text><text x="850" y="263" font-size="26" fill="#183B56" font-weight="700">Protected records &amp; files</text><text x="850" y="301" font-size="22" fill="#526C80" font-weight="400">Scoped academic resources</text><text x="850" y="332" font-size="22" fill="#526C80" font-weight="400">Private object access</text><path d="M 374 268 L 435 268" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 765 268 L 826 268" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="410" width="535" height="180" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="448" font-size="20" fill="#087F8C" font-weight="700">INSTITUTION A</text><text x="68" y="488" font-size="26" fill="#183B56" font-weight="700">Authorized local operations</text><text x="68" y="526" font-size="22" fill="#526C80" font-weight="400">Students, staff, courses, finance and documents</text><text x="68" y="557" font-size="22" fill="#526C80" font-weight="400">Cross-institution identifiers confer no authority.</text><rect x="621" y="410" width="535" height="180" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="645" y="448" font-size="20" fill="#087F8C" font-weight="700">INSTITUTION B</text><text x="645" y="488" font-size="26" fill="#183B56" font-weight="700">Independent access boundary</text><text x="645" y="526" font-size="22" fill="#526C80" font-weight="400">Its own memberships and protected resources</text><text x="645" y="557" font-size="22" fill="#526C80" font-weight="400">Global administrator paths remain explicit.</text><rect x="44" y="640" width="1112" height="80" rx="16" fill="#E7F4F4" stroke="#E7F4F4"/><text x="68" y="690" font-size="24" fill="#087F8C" font-weight="600">Sensitive locked mutations revalidate authority after waiting for the database lock.</text><text x="44" y="774" font-size="16" fill="#526C80" font-weight="600">ACADEMIC SYSTEMS • ONE COHERENT BACKEND</text><text x="1015" y="774" font-size="16" fill="#087F8C" font-weight="700">ACADEMIX</text></g></svg>