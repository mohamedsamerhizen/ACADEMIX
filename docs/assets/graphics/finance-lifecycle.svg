<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-labelledby="title desc"><title id="title">Student finance with accountable corrections</title><desc id="desc">Internal institutional accounting workflows; payment records do not execute bank settlement.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F8C"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="1198" height="823" rx="16" fill="#F4F8FB" stroke="#CBD9E4"/><text x="44" y="48" font-size="18" fill="#087F8C" font-weight="700">ACADEMIX / ENGINEERING ATLAS</text><text x="44" y="100" font-size="38" fill="#102A43" font-weight="700">Student finance with accountable corrections</text><text x="44" y="139" font-size="23" fill="#526C80" font-weight="400">Internal institutional accounting workflows; payment records do not execute bank settlement.</text><rect x="44" y="185" width="330" height="175" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="223" font-size="20" fill="#087F8C" font-weight="700">01 / ASSESS</text><text x="68" y="263" font-size="26" fill="#183B56" font-weight="700">Fees &amp; invoices</text><text x="68" y="301" font-size="22" fill="#526C80" font-weight="400">Term charges and billing</text><text x="68" y="332" font-size="22" fill="#526C80" font-weight="400">Currency-aware amounts</text><rect x="435" y="185" width="330" height="175" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="459" y="223" font-size="20" fill="#087F8C" font-weight="700">02 / ASSIST</text><text x="459" y="263" font-size="26" fill="#183B56" font-weight="700">Scholarship assistance</text><text x="459" y="301" font-size="22" fill="#526C80" font-weight="400">Budget controls and awards</text><text x="459" y="332" font-size="22" fill="#526C80" font-weight="400">Approved financial support</text><rect x="826" y="185" width="330" height="175" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="850" y="223" font-size="20" fill="#087F8C" font-weight="700">03 / RECEIVE</text><text x="850" y="263" font-size="26" fill="#183B56" font-weight="700">Payments &amp; allocations</text><text x="850" y="301" font-size="22" fill="#526C80" font-weight="400">Verify recorded receipts</text><text x="850" y="332" font-size="22" fill="#526C80" font-weight="400">Allocate to valid obligations</text><rect x="44" y="425" width="330" height="175" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="463" font-size="20" fill="#087F8C" font-weight="700">04 / CORRECT</text><text x="68" y="503" font-size="26" fill="#183B56" font-weight="700">Refunds &amp; corrections</text><text x="68" y="541" font-size="22" fill="#526C80" font-weight="400">Approved correcting entries</text><text x="68" y="572" font-size="22" fill="#526C80" font-weight="400">Preserved financial evidence</text><rect x="435" y="425" width="330" height="175" rx="16" fill="#102A43" stroke="#CBD9E4"/><text x="459" y="463" font-size="20" fill="#D8B766" font-weight="700">ACCOUNTING CORE</text><text x="459" y="503" font-size="26" fill="#FFFFFF" font-weight="700">Balanced ledger</text><text x="459" y="541" font-size="22" fill="#D4E3EF" font-weight="400">Transactions and constraints</text><text x="459" y="572" font-size="22" fill="#D4E3EF" font-weight="400">Audit-preserving journals</text><rect x="826" y="425" width="330" height="175" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="850" y="463" font-size="20" fill="#087F8C" font-weight="700">05 / ELIGIBILITY</text><text x="850" y="503" font-size="26" fill="#183B56" font-weight="700">Holds &amp; clearances</text><text x="850" y="541" font-size="22" fill="#526C80" font-weight="400">Policy-controlled restrictions</text><text x="850" y="572" font-size="22" fill="#526C80" font-weight="400">Live debt checks at cutoffs</text><path d="M 600 360 L 600 425" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 374 512 L 435 512" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 765 512 L 826 512" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="655" width="1112" height="85" rx="16" fill="#E7F4F4" stroke="#E7F4F4"/><text x="68" y="706" font-size="24" fill="#087F8C" font-weight="600">Financial state supports academic access decisions through explicit institutional policies.</text><text x="44" y="799" font-size="16" fill="#526C80" font-weight="600">ACADEMIC SYSTEMS • ONE COHERENT BACKEND</text><text x="1015" y="799" font-size="16" fill="#087F8C" font-weight="700">ACADEMIX</text></g></svg>