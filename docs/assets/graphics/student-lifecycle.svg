<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="875" viewBox="0 0 1200 875" role="img" aria-labelledby="title desc"><title id="title">From admission to institutional credentials</title><desc id="desc">Read left to right within each numbered stage. Later decisions depend on fresh evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F8C"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="1198" height="873" rx="16" fill="#F4F8FB" stroke="#CBD9E4"/><text x="44" y="48" font-size="18" fill="#087F8C" font-weight="700">ACADEMIX / ENGINEERING ATLAS</text><text x="44" y="100" font-size="38" fill="#102A43" font-weight="700">From admission to institutional credentials</text><text x="44" y="139" font-size="23" fill="#526C80" font-weight="400">Read left to right within each numbered stage. Later decisions depend on fresh evidence.</text><rect x="44" y="185" width="356" height="170" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="223" font-size="20" fill="#087F8C" font-weight="700">01</text><text x="68" y="263" font-size="26" fill="#183B56" font-weight="700">Admission</text><text x="68" y="301" font-size="22" fill="#526C80" font-weight="400">Authorized eligibility decisions</text><rect x="422" y="185" width="356" height="170" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="446" y="223" font-size="20" fill="#087F8C" font-weight="700">02</text><text x="446" y="263" font-size="26" fill="#183B56" font-weight="700">Registration</text><text x="446" y="301" font-size="22" fill="#526C80" font-weight="400">Program and prerequisite rules</text><rect x="800" y="185" width="356" height="170" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="824" y="223" font-size="20" fill="#087F8C" font-weight="700">03</text><text x="824" y="263" font-size="26" fill="#183B56" font-weight="700">Learning activities</text><text x="824" y="301" font-size="22" fill="#526C80" font-weight="400">Course delivery and submissions</text><rect x="44" y="390" width="356" height="170" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="428" font-size="20" fill="#087F8C" font-weight="700">04</text><text x="68" y="468" font-size="26" fill="#183B56" font-weight="700">Examinations</text><text x="68" y="506" font-size="22" fill="#526C80" font-weight="400">Published, frozen attempt data</text><rect x="422" y="390" width="356" height="170" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="446" y="428" font-size="20" fill="#087F8C" font-weight="700">05</text><text x="446" y="468" font-size="26" fill="#183B56" font-weight="700">Official grades</text><text x="446" y="506" font-size="22" fill="#526C80" font-weight="400">Reconcile evidence and overrides</text><rect x="800" y="390" width="356" height="170" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="824" y="428" font-size="20" fill="#087F8C" font-weight="700">06</text><text x="824" y="468" font-size="26" fill="#183B56" font-weight="700">Transcript</text><text x="824" y="506" font-size="22" fill="#526C80" font-weight="400">Synchronize current grade sources</text><rect x="44" y="595" width="356" height="170" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="633" font-size="20" fill="#087F8C" font-weight="700">07</text><text x="68" y="673" font-size="26" fill="#183B56" font-weight="700">Degree audit</text><text x="68" y="711" font-size="22" fill="#526C80" font-weight="400">Recognized, qualifying credits</text><rect x="422" y="595" width="356" height="170" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="446" y="633" font-size="20" fill="#087F8C" font-weight="700">08</text><text x="446" y="673" font-size="26" fill="#183B56" font-weight="700">Graduation approval</text><text x="446" y="711" font-size="22" fill="#526C80" font-weight="400">Separate review and approval</text><rect x="800" y="595" width="356" height="170" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="824" y="633" font-size="20" fill="#087F8C" font-weight="700">09</text><text x="824" y="673" font-size="26" fill="#183B56" font-weight="700">Credentials</text><text x="824" y="711" font-size="22" fill="#526C80" font-weight="400">Issue source-dependent records</text><text x="44" y="827" font-size="23" fill="#087F8C" font-weight="600">Authority is checked at each operation; historical records remain distinct from current validity.</text><text x="44" y="849" font-size="16" fill="#526C80" font-weight="600">ACADEMIC SYSTEMS • ONE COHERENT BACKEND</text><text x="1015" y="849" font-size="16" fill="#087F8C" font-weight="700">ACADEMIX</text></g></svg>