<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-labelledby="title desc"><title id="title">Durability spans database and object storage</title><desc id="desc">The two stores have different commit boundaries; recovery work is recorded explicitly.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F8C"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="1198" height="823" rx="16" fill="#F4F8FB" stroke="#CBD9E4"/><text x="44" y="48" font-size="18" fill="#087F8C" font-weight="700">ACADEMIX / ENGINEERING ATLAS</text><text x="44" y="100" font-size="38" fill="#102A43" font-weight="700">Durability spans database and object storage</text><text x="44" y="139" font-size="23" fill="#526C80" font-weight="400">The two stores have different commit boundaries; recovery work is recorded explicitly.</text><rect x="44" y="185" width="535" height="175" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="223" font-size="20" fill="#087F8C" font-weight="700">POSTGRESQL TRANSACTION</text><text x="68" y="263" font-size="26" fill="#183B56" font-weight="700">Business state + Outbox</text><text x="68" y="301" font-size="22" fill="#526C80" font-weight="400">Commit durable intent with the domain mutation.</text><text x="68" y="332" font-size="22" fill="#526C80" font-weight="400">Lease delivery work and persist retry/backoff.</text><rect x="621" y="185" width="535" height="175" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="645" y="223" font-size="20" fill="#087F8C" font-weight="700">BACKGROUND DELIVERY</text><text x="645" y="263" font-size="26" fill="#183B56" font-weight="700">Fresh scope on each attempt</text><text x="645" y="301" font-size="22" fill="#526C80" font-weight="400">Retry with a new dependency / EF context scope.</text><text x="645" y="332" font-size="22" fill="#526C80" font-weight="400">Use stable deduplication keys where implemented.</text><path d="M 579 270 L 621 270" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="425" width="535" height="175" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="463" font-size="20" fill="#087F8C" font-weight="700">PRIVATE MINIO OBJECTS</text><text x="68" y="503" font-size="26" fill="#183B56" font-weight="700">Upload + database references</text><text x="68" y="541" font-size="22" fill="#526C80" font-weight="400">Persist cleanup intent independently before upload.</text><text x="68" y="572" font-size="22" fill="#526C80" font-weight="400">Commit references with the authorized operation.</text><rect x="621" y="425" width="535" height="175" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="645" y="463" font-size="20" fill="#087F8C" font-weight="700">RECOVERY / CLEANUP</text><text x="645" y="503" font-size="26" fill="#183B56" font-weight="700">Recheck before deletion</text><text x="645" y="541" font-size="22" fill="#526C80" font-weight="400">Institution lock + current reference check</text><text x="645" y="572" font-size="22" fill="#526C80" font-weight="400">preserve committed objects; retry orphan cleanup.</text><path d="M 579 510 L 621 510" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="655" width="1112" height="85" rx="16" fill="#E7F4F4" stroke="#E7F4F4"/><text x="68" y="691" font-size="23" fill="#087F8C" font-weight="600">Verified: PostgreSQL rollback, MinIO outage/restart, private access and orphan recovery.</text><text x="68" y="723" font-size="21" fill="#526C80" font-weight="400">These controlled scenarios do not prove exhaustive disaster recovery or universal exactly-once delivery.</text><text x="44" y="799" font-size="16" fill="#526C80" font-weight="600">ACADEMIC SYSTEMS • ONE COHERENT BACKEND</text><text x="1015" y="799" font-size="16" fill="#087F8C" font-weight="700">ACADEMIX</text></g></svg>