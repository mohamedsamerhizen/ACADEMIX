<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title desc"><title id="title">Corrections travel through academic records</title><desc id="desc">A changed source must be reconciled before current academic decisions can rely on it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F8C"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="1198" height="803" rx="16" fill="#F4F8FB" stroke="#CBD9E4"/><text x="44" y="48" font-size="18" fill="#087F8C" font-weight="700">ACADEMIX / ENGINEERING ATLAS</text><text x="44" y="100" font-size="38" fill="#102A43" font-weight="700">Corrections travel through academic records</text><text x="44" y="139" font-size="23" fill="#526C80" font-weight="400">A changed source must be reconciled before current academic decisions can rely on it.</text><rect x="44" y="185" width="330" height="180" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="223" font-size="20" fill="#087F8C" font-weight="700">01 / EVIDENCE</text><text x="68" y="263" font-size="26" fill="#183B56" font-weight="700">Published assessments</text><text x="68" y="301" font-size="22" fill="#526C80" font-weight="400">Exam and assignment sources</text><text x="68" y="332" font-size="22" fill="#526C80" font-weight="400">Appeals / authorized corrections</text><rect x="435" y="185" width="330" height="180" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="459" y="223" font-size="20" fill="#087F8C" font-weight="700">02 / OFFICIAL</text><text x="459" y="263" font-size="26" fill="#183B56" font-weight="700">Gradebook reconciliation</text><text x="459" y="301" font-size="22" fill="#526C80" font-weight="400">Preserve the official result</text><text x="459" y="332" font-size="22" fill="#526C80" font-weight="400">Flag source changes for review</text><rect x="826" y="185" width="330" height="180" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="850" y="223" font-size="20" fill="#087F8C" font-weight="700">03 / RECORDS</text><text x="850" y="263" font-size="26" fill="#183B56" font-weight="700">Transcript synchronization</text><text x="850" y="301" font-size="22" fill="#526C80" font-weight="400">Reject stale current reads</text><text x="850" y="332" font-size="22" fill="#526C80" font-weight="400">Refresh academic source state</text><path d="M 374 275 L 435 275" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 765 275 L 826 275" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="425" width="535" height="175" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="463" font-size="20" fill="#087F8C" font-weight="700">04 / ELIGIBILITY</text><text x="68" y="503" font-size="26" fill="#183B56" font-weight="700">Recalculate and reassess</text><text x="68" y="541" font-size="22" fill="#526C80" font-weight="400">Standing, recognized credit and degree decisions</text><text x="68" y="572" font-size="22" fill="#526C80" font-weight="400">must use qualifying, current academic evidence.</text><rect x="621" y="425" width="535" height="175" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="645" y="463" font-size="20" fill="#087F8C" font-weight="700">05 / CREDENTIALS</text><text x="645" y="503" font-size="26" fill="#183B56" font-weight="700">Retain history; reassess validity</text><text x="645" y="541" font-size="22" fill="#526C80" font-weight="400">Historical PDFs keep their original bytes.</text><text x="645" y="572" font-size="22" fill="#526C80" font-weight="400">Source change affects verification / reissuance.</text><rect x="44" y="655" width="1112" height="75" rx="16" fill="#E7F4F4" stroke="#E7F4F4"/><text x="68" y="701" font-size="23" fill="#087F8C" font-weight="600">Correction does not silently rewrite published history or automatically recalculate every record.</text><text x="44" y="779" font-size="16" fill="#526C80" font-weight="600">ACADEMIC SYSTEMS • ONE COHERENT BACKEND</text><text x="1015" y="779" font-size="16" fill="#087F8C" font-weight="700">ACADEMIX</text></g></svg>