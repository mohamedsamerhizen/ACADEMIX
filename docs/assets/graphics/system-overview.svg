<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">A connected university model</title><desc id="desc">Institution scope connects teaching, academic decisions and supporting operations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F8C"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="1198" height="688" rx="16" fill="#F4F8FB" stroke="#CBD9E4"/><text x="44" y="48" font-size="18" fill="#087F8C" font-weight="700">ACADEMIX / ENGINEERING ATLAS</text><text x="44" y="100" font-size="38" fill="#102A43" font-weight="700">A connected university model</text><text x="44" y="139" font-size="23" fill="#526C80" font-weight="400">Institution scope connects teaching, academic decisions and supporting operations.</text><rect x="44" y="185" width="330" height="180" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="223" font-size="20" fill="#087F8C" font-weight="700">01 / ENTER</text><text x="68" y="263" font-size="26" fill="#183B56" font-weight="700">Admissions &amp; identity</text><text x="68" y="301" font-size="22" fill="#526C80" font-weight="400">Applicants, profiles, roles</text><text x="68" y="332" font-size="22" fill="#526C80" font-weight="400">Institutions and programs</text><rect x="44" y="400" width="330" height="180" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="68" y="438" font-size="20" fill="#087F8C" font-weight="700">02 / PARTICIPATE</text><text x="68" y="478" font-size="26" fill="#183B56" font-weight="700">Teaching &amp; assessment</text><text x="68" y="516" font-size="22" fill="#526C80" font-weight="400">Registration, LMS, exams</text><text x="68" y="547" font-size="22" fill="#526C80" font-weight="400">Gradebook and appeals</text><rect x="430" y="275" width="340" height="210" rx="16" fill="#102A43" stroke="#CBD9E4"/><text x="454" y="313" font-size="20" fill="#D8B766" font-weight="700">SHARED CORE</text><text x="454" y="353" font-size="26" fill="#FFFFFF" font-weight="700">Academic records</text><text x="454" y="391" font-size="22" fill="#D4E3EF" font-weight="400">Student • program • term</text><text x="454" y="422" font-size="22" fill="#D4E3EF" font-weight="400">Course • section • evidence</text><text x="454" y="453" font-size="22" fill="#D4E3EF" font-weight="400">Current authority and history</text><rect x="826" y="185" width="330" height="180" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="850" y="223" font-size="20" fill="#087F8C" font-weight="700">03 / PROGRESS</text><text x="850" y="263" font-size="26" fill="#183B56" font-weight="700">Records &amp; credentials</text><text x="850" y="301" font-size="22" fill="#526C80" font-weight="400">Transcript, standing, audit</text><text x="850" y="332" font-size="22" fill="#526C80" font-weight="400">Graduation and documents</text><rect x="826" y="400" width="330" height="180" rx="16" fill="#FFFFFF" stroke="#CBD9E4"/><text x="850" y="438" font-size="20" fill="#087F8C" font-weight="700">04 / SUPPORT</text><text x="850" y="478" font-size="26" fill="#183B56" font-weight="700">University operations</text><text x="850" y="516" font-size="22" fill="#526C80" font-weight="400">Finance, campus, services</text><text x="850" y="547" font-size="22" fill="#526C80" font-weight="400">Quality and notifications</text><path d="M 374 275 L 430 315" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 374 475 L 430 435" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 770 315 L 826 275" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 770 435 L 826 475" stroke="#087F8C" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="44" y="664" font-size="16" fill="#526C80" font-weight="600">ACADEMIC SYSTEMS • ONE COHERENT BACKEND</text><text x="1015" y="664" font-size="16" fill="#087F8C" font-weight="700">ACADEMIX</text></g></svg>